aid: boldfit
name: Boldfit
description: >-
  Boldfit is an Indian direct-to-consumer fitness and sportswear brand selling
  workout equipment (pull-up bars, resistance bands, massage guns, yoga mats and
  lifting gear), performance footwear (running, trekking, walking, cricket and
  badminton shoes) and athletic apparel for men and women. The brand positions
  itself around fitness and performance, partnering with athletes, and sells
  primarily to the Indian market through a Shopify-hosted online store at
  boldfit.com. It was surfaced as a portfolio company of Bessemer Venture
  Partners and added to the API Evangelist network. Boldfit does not run a public
  developer program or API; the only programmatic surface is the Shopify Customer
  Account OAuth 2.0 / OpenID Connect layer exposed on the storefront.
